<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TechRun</title>
  <meta name="description" content="TechRun 2027 by GN Club: a tech-powered fun run. 3K, 5K and 10K. Move people for a brighter tomorrow." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wdth,wght@75..100,400..900&family=Tiny5&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <noscript><style>body{cursor:auto}#cursor{display:none}</style></noscript>
</head>
<body>
  <main id="about-text"></main>
  <noscript><p class="nojs">TechRun 2027 is a scroll-driven film and needs JavaScript to play. Contact: techrun.contactus@gmail.com</p></noscript>
  <div id="viewport">
    <div id="stage">
      <canvas id="gun" width="1920" height="1080"></canvas>
    </div>
  </div>
  <canvas id="stars"></canvas>
  <div id="hud"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <div id="ammo"><u></u><u></u><u></u></div>
  <div id="act"></div>
  <div id="cue"></div>
  <div id="grain"></div>
  <div id="cursor"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TechRun</title>
  <meta name="description" content="TechRun 2027 by GN Club: a tech-powered fun run. 3K, 5K and 10K. Move people for a brighter tomorrow." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <!-- self-hosted latin subsets (see css/style.css); main.js waits for them before the film starts -->
  <link rel="preload" href="assets/fonts/tektur-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/tiny5-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- deferred: they run in order, before the js/main.js module. The location globe (cut from the short cut) also
       needs d3-array@3.2.4, d3-geo@3.1.1 and topojson-client@3.1.0 here if that scene is restored. -->
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- the film's modules, fetched in parallel instead of one import level at a time -->
  <link rel="modulepreload" href="js/main.js" />
  <link rel="modulepreload" href="js/content.js" />
  <link rel="modulepreload" href="js/stage.js" />
  <link rel="modulepreload" href="js/palette.js" />
  <link rel="modulepreload" href="js/scenes/index.js" />
  <link rel="modulepreload" href="js/scenes/util.js" />
  <link rel="modulepreload" href="js/scenes/boot.js" />
  <link rel="modulepreload" href="js/scenes/about.js" />
  <link rel="modulepreload" href="js/scenes/highlights.js" />
  <noscript><style>body{cursor:auto}#cursor{display:none}</style></noscript>
</head>
<body>
  <main id="about-text"></main>
  <noscript><p class="nojs">TechRun 2027 is a scroll-driven film and needs JavaScript to play. Contact: techrun.contactus@gmail.com</p></noscript>
  <div id="viewport">
    <div id="stage">
      <canvas id="gun" width="1920" height="1080"></canvas>
    </div>
  </div>
  <canvas id="stars"></canvas>
  <div id="hud"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <div id="ammo"><u></u><u></u><u></u></div>
  <div id="act"></div>
  <div id="cue"></div>
  <div id="grain"></div>
  <div id="cursor"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
